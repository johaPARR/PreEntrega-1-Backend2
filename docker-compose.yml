services:
  app:
    build: .
    container_name: plataforma-eventos-api
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
      MONGO_URL: mongodb://mongo:27017/plataforma-eventos
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: plataforma-eventos-mongo
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_data: